# CodeClash reverse proxy — TLS termination + WebSocket upgrade.
# Mounted into /etc/nginx/conf.d/ so it loads inside the stock nginx.conf http{}.
# All routes (/api, /ws, /docs, SPA static) are served by the FastAPI app on 8000;
# nginx terminates TLS and upgrades the duel WebSocket.

upstream codeclash_app {
    server app:8000;
    keepalive 32;            # reuse upstream conns for the chatty REST/polling traffic
}

# WebSocket needs Connection: upgrade; plain HTTP keeps the keepalive pool ("").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: ACME http-01 challenge passthrough + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;          # certbot --webroot writes challenges here
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 1m;            # submission payloads are small; cap abuse

    # FastAPI's StaticFiles serves the SPA bundle uncompressed, so gzip here drops
    # the ~775 KB of JS+CSS to ~255 KB over the wire. gzip_proxied is required since
    # these come from an upstream; woff2 fonts are already compressed (omitted).
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    # Python 3.12's mimetypes labels .js as text/javascript (not the older
    # application/javascript), so list both or the bundle ships uncompressed.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # Vite content-hashes asset filenames (index-<hash>.js), so a given URL never
    # changes contents — cache it forever and skip the per-load revalidation.
    location /assets/ {
        proxy_pass http://codeclash_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shared proxy headers for both location blocks.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Duel WebSocket: long-lived. read timeout must exceed DUEL_CAP_SECONDS (1800)
    # so a quiet-but-live duel is never dropped by the proxy.
    location /ws/ {
        proxy_pass http://codeclash_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://codeclash_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # keepalive to the upstream pool
    }
}
